services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kd_desgin
      POSTGRES_USER: kd
      POSTGRES_PASSWORD: kd_dev_only
    ports:
      - "5433:5432"
    volumes:
      - kd_pgdata:/var/lib/postgresql/data
# volumes:
#   kd_pgdata:
volumes:
  kd_pgdata:
    external: true
    name: kd-desgin-starter_kd_pgdata
