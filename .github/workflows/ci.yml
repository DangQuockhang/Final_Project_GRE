name: KD Starter CI
on:
  push:
    branches: [main, develop, feature/sprint-2, experiment/react-retail]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --include=optional --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check server/src/index.js
      - name: Smoke-test store in headless Chrome
        run: |
          set -eu
          npm run dev:store > /tmp/kd-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BROWSER" ]; then
            echo "Chrome/Chromium not installed on runner"; exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:5173/ > /tmp/kd-dom.html 2>/tmp/kd-browser.log || { cat /tmp/kd-browser.log; exit 1; }
          if ! grep -q 'Discover your' /tmp/kd-dom.html; then
            echo "Homepage was not rendered by React:"
            head -c 6000 /tmp/kd-dom.html
            echo "Browser log:"
            tail -n 50 /tmp/kd-browser.log
            echo "Vite log:"
            cat /tmp/kd-vite.log
            exit 1
          fi
          grep -q "Shop by" /tmp/kd-dom.html || { echo "Homepage category discovery section missing"; exit 1; }
          grep -q "Brands worth" /tmp/kd-dom.html || { echo "Homepage brands section missing"; exit 1; }
          grep -q "COLLECTIONS" /tmp/kd-dom.html || { echo "Collections navigation missing"; exit 1; }
          grep -q "ALL PRODUCTS" /tmp/kd-dom.html || { echo "All Products navigation missing"; exit 1; }
          grep -q "SALE" /tmp/kd-dom.html || { echo "Sale navigation missing"; exit 1; }
          if grep -q "THE NEW EXPRESSION OF STYLE" /tmp/kd-dom.html; then echo "Old Hero eyebrow still visible"; exit 1; fi
          if grep -q "01 / 04" /tmp/kd-dom.html; then echo "Old Hero photo counter still visible"; exit 1; fi
          if grep -q "CONTEMPORARY STYLE, THOUGHTFULLY CURATED" /tmp/kd-dom.html; then echo "Old announcement strip still visible"; exit 1; fi
          if grep -q "Discover considered everyday style" /tmp/kd-dom.html; then echo "Old benefits strip still visible"; exit 1; fi
          echo "React redesigned homepage rendered successfully in Chrome"
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:5173/shop > /tmp/kd-shop.html 2>/tmp/kd-shop.log
          grep -q "Filter" /tmp/kd-shop.html || { echo "Shop did not render"; tail -n 30 /tmp/kd-shop.log; exit 1; }
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:5173/product/essential-sculpt-tee > /tmp/kd-product.html 2>/tmp/kd-product.log
          grep -q "Select size for chosen color" /tmp/kd-product.html || { echo "Product size selector did not render"; tail -n 30 /tmp/kd-product.log; exit 1; }
          echo "Shop and product detail rendered successfully in Chrome"
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:5173/admin > /tmp/kd-admin-guard.html 2>/tmp/kd-admin-guard.log
          grep -q 'SIGN IN' /tmp/kd-admin-guard.html || grep -q 'Sign in' /tmp/kd-admin-guard.html || { echo "Admin route did not guard unauthenticated access"; tail -n 40 /tmp/kd-admin-guard.log; exit 1; }
          echo "Admin route redirects unauthenticated users"

  integration-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kd_test
          POSTGRES_USER: kd
          POSTGRES_PASSWORD: local_ci_demo_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kd -d kd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://kd:local_ci_demo_only@localhost:5432/kd_test
      JWT_SECRET: integration-only-long-secret-value-for-demo-tests
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: CiAdminPasswordForTests2026
      BANK_TRANSFER_BANK: CI Test Bank
      BANK_TRANSFER_ACCOUNT: 0000000000
      BANK_TRANSFER_NAME: Test Recipient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --include=optional --no-audit --no-fund
      - run: npm run db:init
      - run: npm run db:init
      - run: npm run db:seed
      - run: node --test tests/api-integration.ci.js
